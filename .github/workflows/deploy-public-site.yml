name: Deploy standalone public site

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'willshacklett/gvai-safety-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Stage and package only approved public files
        shell: python
        run: |
          import os
          import shutil
          import tarfile
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          output = Path(os.environ['RUNNER_TEMP']) / 'public-site'
          output.mkdir()
          files = (
              'assets/Coming Soon.png',
              'assets/GvAI-MIT-LICENSE.txt',
              'assets/ask-gvai-button-isolated.png',
              'assets/gvai-mark.svg',
              'assets/gvai-protection-snapshot-reference.png',
              'developers.html',
              'features.html',
              'global-ai-watch.css',
              'index.html',
              'llms.txt',
              'prototype-demo.css',
              'prototype-demo.html',
              'prototype-demo.js',
              'prototype-site.css',
              'site.css',
              'site.js',
          )
          for name in files:
              source = root / name
              if (not source.is_file() or source.is_symlink()
                      or any(p.is_symlink() for p in source.parents if p != root)
                      or not source.resolve().is_relative_to(root)):
                  raise SystemExit(f'Missing or unsafe public file: {name}')
              target = output / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          actual = {p.relative_to(output).as_posix() for p in output.rglob('*') if p.is_file()}
          if actual != set(files):
              raise SystemExit('Public artifact differs from the approved allowlist')

          # Set archive permissions explicitly; filesystem defaults are not portable.
          archive = Path(os.environ['RUNNER_TEMP']) / 'artifact.tar'
          with tarfile.open(archive, mode='x', format=tarfile.USTAR_FORMAT) as package:
              for name in ('.', './assets'):
                  entry = tarfile.TarInfo(name)
                  entry.type = tarfile.DIRTYPE
                  entry.mode = 0o755
                  package.addfile(entry)
              for name in files:
                  source = output / name
                  entry = tarfile.TarInfo('./' + name)
                  entry.mode = 0o644
                  entry.size = source.stat().st_size
                  with source.open('rb') as content:
                      package.addfile(entry, content)
          with tarfile.open(archive, mode='r:') as package:
              members = package.getmembers()
              expected = {'.', './assets'} | {'./' + name for name in files}
              if len(members) != len(expected) or {m.name for m in members} != expected:
                  raise SystemExit('Unexpected Pages archive contents')
              for entry in members:
                  if entry.name in ('.', './assets'):
                      valid = entry.isdir() and entry.mode == 0o755
                  else:
                      valid = entry.isfile() and entry.mode == 0o644
                  if not valid:
                      raise SystemExit('Unsafe Pages archive type or permissions')

      - name: Upload public artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: false

  deploy:
    if: github.repository == 'willshacklett/gvai-safety-site' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Require Actions source and gvaisafety.com
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import urllib.request

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/pages"
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              pages = json.load(response)
          if pages.get('build_type') != 'workflow':
              raise SystemExit('Pages source must first be set to GitHub Actions by the owner')
          if pages.get('cname') != 'gvaisafety.com':
              raise SystemExit('Pages custom domain must be exactly gvaisafety.com')

      - name: Deploy approved artifact
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
